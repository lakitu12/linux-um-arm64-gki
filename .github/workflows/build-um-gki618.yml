name: build-um-gki618

# The Android 17 GKI variant of the um-arm64 sandbox kernel: apply the
# um-arm64 GKI-6.18 patch stack (gki618/patches) onto the Android 17 GKI
# kernel (kernel/common android17-6.18, Linux 6.18 LTS), build the bionic
# UML kernel with the NDK, then boot it on an arm64 runner with a marker
# gate — no device needed for the smoke test.
#
# The patch stack is the deliverable of the GKI port: the upstream port
# series + the Android guest fixes + backports of upstream fixes the 6.18
# base predates + the build fixes r28c exposed. Every patch keeps its
# original author/date; the why of each is in gki618/fixlog.md, the
# validated baseline data (6.18.32, sha256 of artifacts) in
# gki618/PORT-STATUS.md.
#
# The schedule re-tests the stack against the current GKI branch tip, so
# the next GKI drop that breaks the stack shows up as a red run carrying a
# conflict report instead of silently rotting.
#
# Every build also merges the default guest feature set (docker / snap /
# flatpak plus the Android guest gates — README, "Guest feature set") and
# the assert step audits it symbol by symbol (ci/cfg-check.py).
#
# Runner note: this is a public repo, so GitHub-hosted runners --
# including the arm64 one the boot job uses -- are free. run_boot=false
# keeps a run artifact-only when needed. NDK pinned to r28c -- the
# version the port was validated against (upstream used r27c; r28c
# enables a few extra warning flags, and the stack is fixed up for them).

on:
  workflow_dispatch:
    inputs:
      gki_ref:
        description: "kernel/common ref (branch or tag), e.g. android17-6.18 or android17-6.18-2026-09_r7"
        required: false
        type: string
        default: "android17-6.18"
      extra_config:
        description: "Extra kconfig fragments appended to the default guest feature set, space separated; paths relative to tools/um-arm64/ in the kernel tree."
        required: false
        type: string
        default: ""
      pages4k:
        description: "Build the 4 KB guest-page variant instead of the validated 16 KB default (fragment: ci/page4k.config); artifacts get a -4k suffix."
        required: false
        type: boolean
        default: false
      run_boot:
        description: "Run the arm64 marker boot gate"
        required: false
        type: boolean
        default: true
  schedule:
    # Monthly re-test against the branch tip (GKI drops roughly monthly).
    - cron: "17 3 6 * *"

env:
  NDK_VER: "r28c"
  KERNEL_REPO: "https://android.googlesource.com/kernel/common"
  # "" or "-4k", from the pages4k input.  The artifact names must match across
  # the build and boot jobs, so the suffix is derived once, here.  Boolean
  # inputs cannot be tested through the `inputs` context in `if:`; compare the
  # string form instead (same reason the run_boot gate below does).
  PAGE_SUFFIX: "${{ github.event.inputs.pages4k == 'true' && '-4k' || '' }}"
  KERNEL_DIR: linux
  PATCH_DIR: patches

permissions:
  contents: read

concurrency:
  # Variant-scoped: the 16 KB and 4 KB artifacts are independent, so only
  # same-variant runs supersede each other (a fresh default run replaces an
  # older default run, including the monthly scheduled one, but never a 4 KB
  # run — dispatching both back to back is a normal thing to do).
  group: um-gki618-${{ github.ref }}-${{ github.event.inputs.pages4k == 'true' && '4k' || '16k' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout this repo (patch stack + CI scripts)
        uses: actions/checkout@v4

      - name: Clone the GKI kernel
        env:
          GKI_REF: ${{ inputs.gki_ref || 'android17-6.18' }}
        run: |
          set -euo pipefail
          # Accept a branch or a tag name; strip the full refs/... form.
          REF="$GKI_REF"; REF="${REF#refs/heads/}"; REF="${REF#refs/tags/}"
          git clone --depth=1 --single-branch --branch "$REF" "$KERNEL_REPO" "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          git log -1 --format='GKI tip: %H  %cd  %s' --date=iso | tee "$GITHUB_WORKSPACE/gki-tip.txt"
          awk '/^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION/' Makefile
        shell: bash

      - name: Apply the um-arm64 patch stack
        run: |
          # Stops at the first conflict and leaves apply-report/CONFLICT.txt
          # + apply-report.tsv behind: a GKI drift becomes a readable report.
          mkdir -p apply-report
          bash ci/apply-stack.sh "$KERNEL_DIR" "$PATCH_DIR" "$GITHUB_WORKSPACE/apply-report" 2>&1 | tee apply-report/application.log
        shell: bash

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld libelf-dev zlib1g-dev flex bison make file cpio
        shell: bash

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk
          key: ndk-${{ env.NDK_VER }}

      - name: Download NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          # Same pattern as build-uml-arm64-bionic.yml: the plain zip, not
          # sdkmanager. r28c is what the GKI port was validated against.
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" \
            -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk-x
          mkdir -p /home/runner/android-ndk
          # the zip unpacks as android-ndk-rXX/, and build-bionic.sh expects
          # $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          mv /tmp/ndk-x/android-ndk-${NDK_VER}/* /home/runner/android-ndk/
          rm -rf /tmp/ndk.zip /tmp/ndk-x
          test -x /home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          # No pipe here on purpose: `| head -1` would race -o pipefail the
          # same way the nm assert did (tool exits on EPIPE, pipeline fails).
          /home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version
        shell: bash

      - name: Build bionic kernel
        working-directory: ${{ env.KERNEL_DIR }}/tools/um-arm64
        env:
          NDK: /home/runner/android-ndk
          TREE: ${{ github.workspace }}/${{ env.KERNEL_DIR }}
          ART: ${{ github.workspace }}/artifacts
          O: ${{ runner.temp }}/um-gki618-build
        run: |
          # The default guest feature set, merged into every build (README,
          # "Guest feature set"): docker's requirements ship in the port as
          # config/docker.config; the other fragments live in ci/ and are
          # copied in first, because build-bionic.sh resolves EXTRA_CONFIG
          # relative to tools/um-arm64/.
          cp "$GITHUB_WORKSPACE/ci/docker-completions.config" \
             "$GITHUB_WORKSPACE/ci/snap-flatpak.config" \
             "$GITHUB_WORKSPACE/ci/android-guest.config" \
             "$GITHUB_WORKSPACE/ci/umfb.config" config/
          export EXTRA_CONFIG="config/docker.config config/docker-completions.config config/snap-flatpak.config config/android-guest.config config/umfb.config"
          # 4 KB variant (pages4k=true): the port's default is 16 KB guest
          # pages.  The fragment lives in ci/ so the variant is one input
          # rather than a hand edit; build-bionic.sh merges it (EXTRA_CONFIG)
          # before olddefconfig, so its dependencies resolve.
          if [ "${{ github.event.inputs.pages4k }}" = "true" ]; then
            cp "$GITHUB_WORKSPACE/ci/page4k.config" config/page4k.config
            export EXTRA_CONFIG="$EXTRA_CONFIG config/page4k.config"
          fi
          # extra_config appends to the defaults (last fragment wins a clash).
          if [ -n "${{ inputs.extra_config }}" ]; then
            export EXTRA_CONFIG="$EXTRA_CONFIG ${{ inputs.extra_config }}"
          fi
          echo "EXTRA_CONFIG=$EXTRA_CONFIG"
          # No ccache on purpose, same as build-uml-arm64-bionic.yml.
          bash harness/build-bionic.sh
        shell: bash

      - name: Assert the build came out the way the port needs it
        run: |
          set -euo pipefail
          CFG="${{ runner.temp }}/um-gki618-build/.config"
          test -f "$CFG"
          # Config the port's fixed-up defconfig/harness must produce:
          # The page size follows the variant: pages4k=true builds 4 KB guest
          # pages, the validated default is 16 KB.
          if [ "${{ github.event.inputs.pages4k }}" = "true" ]; then
            PGSIZE=PAGE_SIZE_4KB
          else
            PGSIZE=PAGE_SIZE_16KB
          fi
          echo "expecting guest page size: $PGSIZE"
          for k in STATIC_LINK UML_NET_VECTOR FRAME_WARN "$PGSIZE"; do
            case "$k" in
              FRAME_WARN) grep -E "^CONFIG_FRAME_WARN=8192$" "$CFG" ;;
              *)          grep -E "^CONFIG_${k}=y$" "$CFG" ;;
            esac
            echo "config ok: $k"
          done
          # The guest feature set must really be in the config — a fragment
          # drop fails here, not on a device.  The curated keys are the
          # headline features; cfg-check.py then re-audits EVERY request
          # line of every default fragment, so a renamed or newly
          # dependency-broken symbol fails with its name in the log.
          for k in USER_NS PID_NS OVERLAY_FS SQUASHFS SQUASHFS_XZ SQUASHFS_ZSTD \
                   FUSE_FS VETH BRIDGE NF_TABLES NFT_COMPAT NETFILTER_XT_MARK \
                   IP_NF_TARGET_MASQUERADE IP6_NF_TARGET_MASQUERADE \
                   SECCOMP_FILTER KEYS POSIX_MQUEUE BPF_SYSCALL CGROUP_BPF \
                   MEMCG PSI EXT4_FS_POSIX_ACL BLK_DEV_LOOP IPV6 \
                   NET_SCHED NET_CLS_CGROUP NFT_FIB_INET \
                   FTRACE SCHED_TRACER EVENT_TRACING \
                   ANDROID_BINDER_IPC ANDROID_BINDERFS UML_FB FB; do
            grep -E "^CONFIG_${k}=y$" "$CFG" >/dev/null \
              || { echo "missing config: CONFIG_$k"; exit 1; }
            echo "config ok: $k"
          done
          grep -F 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' "$CFG" >/dev/null \
            || { echo "missing config: ANDROID_BINDER_DEVICES string"; exit 1; }
          echo "config ok: ANDROID_BINDER_DEVICES"
          python3 "$GITHUB_WORKSPACE/ci/cfg-check.py" "$CFG" \
            "$KERNEL_DIR/tools/um-arm64/config/docker.config" \
            "$KERNEL_DIR/tools/um-arm64/config/docker-completions.config" \
            "$KERNEL_DIR/tools/um-arm64/config/snap-flatpak.config" \
            "$KERNEL_DIR/tools/um-arm64/config/android-guest.config" \
            "$KERNEL_DIR/tools/um-arm64/config/umfb.config"

          # Symbols the late fixes/backports brought in must be in the image.
          # Write the nm output to a file first, then grep the file: piping
          # llvm-nm into `grep -q` exits grep at its first match, llvm-nm's
          # next write hits EPIPE and exits 74, and under -o pipefail the
          # pipeline reports 74 — a symbol that just matched reads as
          # missing. One red run proved exactly that (nm=74 grep=0).
          NM=/home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          "$NM" artifacts/linux-bionic > nm-full.txt || { echo "llvm-nm failed (rc=$?)"; exit 1; }
          echo "nm: $(wc -l < nm-full.txt) lines"
          file artifacts/linux-bionic
          for s in os_futex_wake elf_aux_min_sigstack elf_aux_hwcap2 apply_alternatives; do
            grep -qE " $s$" nm-full.txt || {
              echo "missing symbol: $s — near matches:"
              grep -a "$s" nm-full.txt | head -8 || true
              exit 1
            }
            echo "symbol ok: $s"
          done
        shell: bash

      - name: Collect artifacts
        run: |
          set -euo pipefail
          A="${{ github.workspace }}/artifacts"
          test -f "$A/linux-bionic" || { echo "linux-bionic missing under $A"; exit 1; }
          sha256sum "$A/linux-bionic" | tee "$A/SHA256SUMS"
          [ -f "$A/stub_exe_bionic" ] && sha256sum "$A/stub_exe_bionic" | tee -a "$A/SHA256SUMS"
          ls -la "$A"
        shell: bash

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: um-gki618${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: |
            artifacts/linux-bionic
            artifacts/stub_exe_bionic
            artifacts/SHA256SUMS
            artifacts/build-bionic-*.log
            apply-report/
            gki-tip.txt
          if-no-files-found: error

      - name: Upload failure evidence (on failure)
        # A red run must carry its evidence: the apply report for a GKI
        # drift, plus the kernel, nm dump, build log and .config when the
        # failure is further down, so no re-run is needed to diagnose it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: um-gki618-failure${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: |
            apply-report/
            gki-tip.txt
            nm-full.txt
            artifacts/linux-bionic
            artifacts/stub_exe_bionic
            artifacts/build-bionic-*.log
            ${{ runner.temp }}/um-gki618-build/.config
          if-no-files-found: warn

  boot:
    needs: build
    # Boolean inputs cannot be tested via the `inputs` context in `if:`;
    # compare the string form instead. Scheduled runs default to boot on.
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_boot == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (CI scripts + gate init)
        uses: actions/checkout@v4

      - name: Download the built kernel
        uses: actions/download-artifact@v4
        with:
          name: um-gki618${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: ci-artifacts

      - name: Install gate tools
        # The gates bake their fixtures with the runner's native gcc (cpio
        # for the initramfs; e2fsprogs + qemu-img for the qcow2 root disk);
        # don't assume any of them is in the base image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev cpio e2fsprogs qemu-utils
        shell: bash

      - name: Marker boot gate
        run: |
          mkdir -p boot-out
          bash ci/boot-gate.sh ci-artifacts/artifacts/linux-bionic boot-out | tee boot-out/summary.txt
        shell: bash

      - name: qcow2 root-disk gate
        run: |
          mkdir -p boot-out-qcow2
          bash ci/qcow2-gate.sh ci-artifacts/artifacts/linux-bionic boot-out-qcow2 | tee boot-out-qcow2/summary.txt
        shell: bash

      - name: UM framebuffer gate
        run: |
          mkdir -p boot-out-umfb
          bash ci/umfb-gate.sh ci-artifacts/artifacts/linux-bionic boot-out-umfb | tee boot-out-umfb/summary.txt
        shell: bash

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-gki618-boot${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: |
            boot-out/boot.log
            boot-out/summary.txt
            boot-out/verdict.txt
          if-no-files-found: warn

      - name: Upload qcow2 gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-gki618-qcow2-boot${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: |
            boot-out-qcow2/boot.log
            boot-out-qcow2/summary.txt
            boot-out-qcow2/verdict.txt
          if-no-files-found: warn

      - name: Upload umfb gate log
        # fb.raw is the evidence the verdict was computed on (~257 KB):
        # the sink header the kernel published plus the bytes the guest
        # wrote, exactly what every viewer consumes.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-gki618-umfb-boot${{ env.PAGE_SUFFIX }}-${{ github.run_number }}
          path: |
            boot-out-umfb/boot.log
            boot-out-umfb/summary.txt
            boot-out-umfb/verdict.txt
            boot-out-umfb/check.txt
            boot-out-umfb/fb.raw
          if-no-files-found: warn